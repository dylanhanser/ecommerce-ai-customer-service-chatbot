<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JD Customer Service RAG Demo</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="chat-card">
        <header class="chat-header">
          <div>
            <h1>JD 客服 RAG Demo (V2)</h1>
            <p>混合检索：历史 QA + 审核话术知识库，Top 5 检索后生成客服回答。</p>
          </div>
          <span class="status-pill">FastAPI</span>
        </header>

        <section class="demo-catalog" aria-labelledby="demoCatalogTitle">
          <div class="demo-catalog-heading">
            <div>
              <h2 id="demoCatalogTitle">演示商品</h2>
              <p>模拟商品数据，仅用于功能演示</p>
            </div>
            <button
              class="demo-catalog-toggle"
              id="demoCatalogToggle"
              type="button"
              aria-controls="demoCatalogBody"
              aria-expanded="true"
            >
              收起商品
            </button>
          </div>
          <div class="demo-catalog-body" id="demoCatalogBody">
            <div
              class="selected-product{% if not selected_product %} is-empty{% endif %}"
              id="selectedProduct"
              data-selected-product-id="{{ selected_product.product_id if selected_product else '' }}"
            >
              {% if selected_product %}
                <strong>当前：{{ selected_product.name }}</strong>
                <span class="demo-data-label">模拟商品数据，仅用于功能演示</span>
              {% else %}
                当前未选择商品
              {% endif %}
            </div>
            <div class="demo-product-list" id="demoProductList" aria-live="polite">
              <p class="demo-product-loading">正在加载演示商品...</p>
            </div>
          </div>
        </section>

        <section class="chat-window" id="chatWindow">
          <div class="message bot">
            <div class="avatar">AI</div>
            <div class="bubble">
              你好，我是店铺客服 RAG 原型。你可以试试：
              <br />
              “可以退货吗”、“鞋子偏大可以换吗”、“发什么快递”、“尺码怎么选”。
            </div>
          </div>
        </section>

        <form class="composer" id="chatForm">
          <input
            id="questionInput"
            name="question"
            type="text"
            autocomplete="off"
            placeholder="请输入用户问题..."
          />
          <button id="sendButton" type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="/static/main.js"></script>
  </body>
</html>
